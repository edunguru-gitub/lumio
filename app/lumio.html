<style>
:root{--bg:#fff3d6;--dots:#f3d9a0;--paper:#fffdf5;--rule:#bfe3ff;--ink:#2b2350;--card:#fff;--line:#2b2350;--sh:#2b2350;--muted:#6d6694;
--c1:#7c5cff;--c2:#ff6fb5;--c3:#ffd84d;--c4:#3ddc97;--c5:#ff8a3d;--c6:#4cc9f0;--good:#1fae63;--bad:#f0405f;--pen:#1d2bd1;
--board:#24473a;--k1:#fffbe8;--k2:#ffa6d1;--k3:#9bf0c8;--k4:#8fdcff;--k5:#ffc78a;--k6:#d4c6ff;
--r:20px 28px 22px 30px/28px 20px 30px 22px;--font:'Fredoka','Trebuchet MS','Comic Sans MS',system-ui,sans-serif;--hand:'Patrick Hand','Segoe Print','Comic Sans MS',cursive}
[data-theme=dark]{--bg:#15112b;--dots:#241d48;--paper:#221c42;--rule:#3a3470;--ink:#f3eeff;--card:#2a2354;--line:#a99aff;--sh:#05030f;--muted:#b3a9e6;--pen:#ffe27a;--board:#0f1d2e;--good:#43e08d;--bad:#ff6b88}
[data-cb=on]{--c1:#0072B2;--c2:#D55E00;--c3:#F0E442;--c4:#009E73;--c5:#E69F00;--c6:#56B4E9;--good:#0072B2;--bad:#D55E00;--k2:#F0A860;--k3:#6fd9b5;--k4:#8cc8ff;--k5:#ffe27a;--k6:#e8e8e8}
[data-cb=on][data-theme=dark]{--good:#56B4E9;--bad:#E69F00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg) radial-gradient(var(--dots) 2px,transparent 2.5px) 0 0/26px 26px;min-height:100vh;font-size:17px;transition:background-color .3s,color .3s}
button,input,select{font-family:inherit;color:inherit}
h2{margin:.1em 0 .4em;font-size:1.5rem}h3{margin:.2em 0 .5em}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-size:1.7rem;font-weight:700;letter-spacing:.5px}
.brand b{background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hud{display:flex;align-items:center;gap:10px}
.xpwrap{min-width:120px}.xpbar{height:14px;border:3px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--c4) 0 8px,var(--c3) 8px 16px);transition:width .6s}
.xpwrap small{display:block;font-size:.72rem;color:var(--muted);line-height:1.1;margin-top:2px}
.streak{font-weight:700;border:3px solid var(--line);background:var(--card);border-radius:14px;padding:3px 9px;box-shadow:2px 2px 0 var(--sh)}
nav{display:flex;gap:8px;overflow-x:auto;padding:6px 14px 12px;scrollbar-width:none}
nav button{flex:0 0 auto;white-space:nowrap}
main{max-width:1120px;margin:0 auto;padding:0 14px 90px}
.page{display:none}.page.active{display:block;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.card{background:var(--card);border:3px solid var(--line);border-radius:var(--r);box-shadow:5px 5px 0 var(--sh);padding:16px;margin-bottom:16px}
.split{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.btn{cursor:pointer;border:3px solid var(--line);background:var(--c3);color:#2b2350;font-weight:600;font-size:1rem;padding:8px 14px;border-radius:16px 22px 16px 24px/22px 16px 24px 16px;box-shadow:3px 3px 0 var(--sh);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-1px,-2px) rotate(-1deg)}.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--sh)}
.btn.sm{padding:4px 10px;font-size:.9rem}.btn.big{font-size:1.2rem;padding:10px 24px;background:var(--c4)}
.btn.on{background:var(--c1);color:#fff}.btn.pink{background:var(--c2)}.btn.blue{background:var(--c6)}.btn.orange{background:var(--c5)}
nav .btn{background:var(--card);color:var(--ink)}nav .btn.on{background:var(--c1);color:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.sb{justify-content:space-between}
.gwrap{border:3px solid var(--line);border-radius:18px;overflow:hidden;background:var(--paper);background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 28px}
canvas#parab{display:block;width:100%;aspect-ratio:5/4}
.sl{display:grid;grid-template-columns:34px 1fr 52px;align-items:center;gap:8px;margin:10px 0}
.sl b{font-size:1.4rem;font-family:var(--hand)}.sl output{text-align:right;font-weight:700}
input[type=range]{-webkit-appearance:none;appearance:none;height:14px;border-radius:10px;border:3px solid var(--line);background:var(--card);width:100%}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--c2);border:3px solid var(--line);cursor:grab}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--c2);border:3px solid var(--line);cursor:grab}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{border:3px solid var(--line);border-radius:16px 22px 16px 22px;padding:8px 10px;color:#2b2350;box-shadow:3px 3px 0 var(--sh)}
.tile small{display:block;font-weight:600;opacity:.8}.tile b{font-size:1.1rem}
.t1{background:var(--c3)}.t2{background:var(--c6)}.t3{background:var(--c4)}.t4{background:var(--c2)}
.formula{font-family:var(--hand);font-size:1.7rem;text-align:center;margin:6px 0}
.bubble{display:flex;gap:10px;align-items:center;background:var(--paper);border:3px dashed var(--line);border-radius:20px;padding:8px 12px;margin-top:10px}
.quest{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:600}
.quest.done{color:var(--good)}
.pad{position:relative;height:min(44vh,300px);border:3px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:4px 4px 0 var(--sh);
background:linear-gradient(90deg,transparent 56px,#ff8aa8 56px,#ff8aa8 58px,transparent 58px),repeating-linear-gradient(transparent 0 33px,var(--rule) 33px 34px),var(--paper)}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.pad canvas.ghost{pointer-events:none}
.pad .hint{position:absolute;left:70px;top:10px;color:var(--muted);font-family:var(--hand);font-size:1.3rem;pointer-events:none}
.qbox{font-family:var(--hand);font-size:1.7rem;text-align:center;border:3px dashed var(--line);border-radius:20px;padding:10px;margin:10px 0;background:var(--paper)}
.qbox small{display:block;font-family:var(--font);font-size:1rem;color:var(--muted)}
.dots{display:flex;gap:6px}.dots i{width:16px;height:16px;border-radius:50%;border:3px solid var(--line);background:var(--card)}
.dots i.ok{background:var(--good)}.dots i.no{background:var(--bad)}.dots i.cur{background:var(--c3);transform:scale(1.2)}
.recog input{width:110px;font-size:1.5rem;font-family:var(--hand);text-align:center;border:3px solid var(--line);border-radius:14px;padding:4px;background:var(--card)}
.fb{min-height:48px;margin-top:10px;font-weight:700;font-size:1.15rem}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px) rotate(-1deg)}75%{transform:translateX(8px) rotate(1deg)}}
.jump{animation:jump .5s}@keyframes jump{40%{transform:translateY(-14px) scale(1.04)}}
.boardwrap{border:10px solid #b07a3c;border-radius:14px;box-shadow:5px 5px 0 var(--sh);background:var(--board);overflow:hidden}
.boardwrap.hide{display:none}canvas#board{display:block;width:100%;aspect-ratio:16/9}
.cap{font-family:var(--hand);font-size:1.35rem;margin:12px 0;min-height:56px;padding:8px 12px;border-left:6px solid var(--c2);background:var(--paper);border-radius:0 14px 14px 0}
.pdots{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.pdots button{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;font-size:.8rem}
.pdots button.cur{background:var(--c2);color:#fff}.pdots button.done{background:var(--c4);color:#2b2350}
select,.sel{border:3px solid var(--line);border-radius:12px;padding:5px 8px;background:var(--card);font-size:1rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.vcard{position:relative;border:3px solid var(--line);border-radius:var(--r);padding:10px;text-align:center;color:#2b2350;box-shadow:4px 4px 0 var(--sh);transition:transform .2s}
.vcard:hover{transform:rotate(-2deg) scale(1.03)}.vcard .emo{font-size:1.9rem}.vcard .pro{font-weight:600}
.vcard .word{font-family:var(--hand);font-size:1.9rem}.vcard .stem{opacity:.85}.vcard .end{background:#fff;border:3px solid var(--line);border-radius:10px;padding:0 5px;margin-left:2px;color:#d6246e;font-weight:700}
.vcard .shape{position:absolute;left:8px;top:4px;font-size:1.1rem;opacity:.7}.vcard .spk{position:absolute;right:6px;top:6px}
.k0{background:var(--c3)}.k1{background:var(--c6)}.k2{background:var(--c4)}.k3{background:var(--c2)}.k4{background:var(--c5)}.k5{background:#c9b8ff}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:12px 0}
.slot{display:flex;align-items:center;gap:6px;border:3px dashed var(--line);border-radius:16px;padding:8px 10px;min-height:56px;background:var(--paper);font-family:var(--hand);font-size:1.5rem}
.slot.over{background:var(--c3)}.slot.full{border-style:solid;background:var(--c4);color:#2b2350}
.slot .drop{min-width:70px;min-height:36px;border-radius:10px;border:2px dotted var(--muted);text-align:center}
.slot.full .drop{border:none;font-weight:700;color:#d6246e}
.echip{cursor:grab;user-select:none;touch-action:none;border:3px solid var(--line);background:var(--c2);color:#fff;border-radius:14px;padding:4px 14px;font-family:var(--hand);font-size:1.5rem;box-shadow:3px 3px 0 var(--sh)}
.echip.sel{outline:4px solid var(--c3)}.echip.used{opacity:.25;pointer-events:none}.echip.fly{position:fixed;z-index:60;pointer-events:none;transform:rotate(6deg)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.lb{display:flex;flex-direction:column;gap:10px}
.lrow{display:grid;grid-template-columns:44px 52px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;cursor:pointer;border:3px solid var(--line);background:var(--card);border-radius:var(--r);padding:8px 12px;box-shadow:4px 4px 0 var(--sh);transition:transform .15s}
.lrow:hover{transform:translate(-2px,-2px) rotate(-.5deg)}.lrow .rk{font-size:1.5rem;font-weight:700;text-align:center}
.lrow .nm{font-weight:600;line-height:1.15}.lrow small{color:var(--muted);display:block}.lrow .sc{font-weight:700;font-size:1.1rem}
.lrow.flash{animation:flash 1s}@keyframes flash{0%,60%{background:var(--c3)}}
.bar{height:8px;border-radius:6px;background:var(--rule);margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c2)}
.modal{position:fixed;inset:0;background:rgba(10,6,30,.65);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px;z-index:50}
.modal[hidden]{display:none}
.mbody{background:var(--bg);border:4px solid var(--line);border-radius:28px;max-width:760px;width:100%;padding:16px;box-shadow:8px 8px 0 var(--sh);animation:pop .3s}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:14px 0}
.podium div{width:30%;text-align:center;color:#2b2350;border:3px solid var(--line);border-radius:14px 14px 0 0;padding:6px 4px;font-weight:600;font-size:.85rem}
.podium .p1{height:120px;background:var(--c3)}.podium .p2{height:92px;background:var(--c6)}.podium .p3{height:74px;background:var(--c5)}
.stu{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;border:3px solid var(--line);border-radius:18px;padding:8px 10px;margin:8px 0;color:#2b2350;box-shadow:3px 3px 0 var(--sh)}
.stu .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}.stu .meta span{background:rgba(255,255,255,.75);border-radius:10px;padding:1px 8px;font-size:.82rem;font-weight:600}
.up{color:#0b7a42}.down{color:#b3122f}
.badge{display:inline-block;background:linear-gradient(90deg,#ffd84d,#ff8a3d);border:2px solid var(--line);border-radius:12px;padding:1px 8px;font-weight:700;font-size:.82rem;animation:glow 1.4s infinite}
@keyframes glow{50%{transform:scale(1.1) rotate(-3deg);box-shadow:0 0 14px #ffd84d}}
.seg{display:inline-flex;gap:6px;flex-wrap:wrap}
.set{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:2px dashed var(--muted)}
.set:last-child{border:none}.set label{font-weight:600}
.sw{width:58px;height:30px;border-radius:20px;border:3px solid var(--line);background:var(--card);position:relative;cursor:pointer}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--line);transition:.2s}
.sw.on{background:var(--c4)}.sw.on::after{left:30px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--c1);color:#fff;border:3px solid var(--line);border-radius:18px;padding:8px 18px;font-weight:700;z-index:80;box-shadow:4px 4px 0 var(--sh);animation:pop .3s}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}
.mut{color:var(--muted)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================= v2: themes ================= */
:root,[data-theme=slate]{--bg:#0d0f1f;--bgimg:none;--paper:#181c37;--rule:#2a3060;--ink:#e7e9f9;--card:#151934;--line:#2c3260;--sh:#000;--muted:#9aa2cf;--c1:#818cf8;--c2:#f472b6;--c3:#fbbf24;--c4:#34d399;--c5:#fb923c;--c6:#38bdf8;--good:#34d399;--bad:#fb7185;--pen:#c7d2fe;--acc:#6366f1;--btn:#232852;--btnink:#e7e9f9;--board:#0e1a2e;--k1:#f1f5ff;--k2:#f9a8d4;--k3:#86efac;--k4:#7dd3fc;--k5:#fdba74;--k6:#c4b5fd;--bw:1px;--shadow:0 6px 18px rgba(0,0,0,.35);--r:14px;--font:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;--hand:Cambria,Georgia,serif;--side:#10132a}
[data-theme=light]{--bg:#f2f5fb;--bgimg:none;--paper:#ffffff;--rule:#cfe0f5;--ink:#141a33;--card:#ffffff;--line:#c3c9de;--sh:#9aa3c4;--muted:#566083;--c1:#4f46e5;--c2:#db2777;--c3:#d97706;--c4:#059669;--c5:#ea580c;--c6:#0284c7;--good:#0a8f55;--bad:#d1213f;--pen:#1b2a9a;--acc:#4338ca;--btn:#eceffa;--btnink:#141a33;--board:#1d3b34;--k1:#fffbe8;--k2:#ffa6d1;--k3:#9bf0c8;--k4:#8fdcff;--k5:#ffc78a;--k6:#d4c6ff;--bw:1.5px;--shadow:0 2px 10px rgba(30,40,90,.12);--r:12px;--font:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;--hand:Cambria,Georgia,serif;--side:#ffffff}
[data-theme=playful]{--bg:#fff3d6;--bgimg:radial-gradient(#f3d9a0 2px,transparent 2.5px);--paper:#fffdf5;--rule:#bfe3ff;--ink:#2b2350;--card:#ffffff;--line:#2b2350;--sh:#2b2350;--muted:#6d6694;--c1:#7c5cff;--c2:#ff6fb5;--c3:#ffd84d;--c4:#3ddc97;--c5:#ff8a3d;--c6:#4cc9f0;--good:#1fae63;--bad:#f0405f;--pen:#1d2bd1;--acc:#7c5cff;--btn:#ffd84d;--btnink:#2b2350;--board:#24473a;--k1:#fffbe8;--k2:#ffa6d1;--k3:#9bf0c8;--k4:#8fdcff;--k5:#ffc78a;--k6:#d4c6ff;--bw:3px;--shadow:5px 5px 0 var(--sh);--r:20px 28px 22px 30px/28px 20px 30px 22px;--font:'Fredoka','Trebuchet MS','Comic Sans MS',system-ui,sans-serif;--hand:'Patrick Hand','Segoe Print','Comic Sans MS',cursive;--side:#fff8e5}
html[data-cb=on]{--c1:#0072B2;--c2:#D55E00;--c3:#F0E442;--c4:#009E73;--c5:#E69F00;--c6:#56B4E9;--good:#0072B2;--bad:#D55E00;--k2:#F0A860;--k3:#6fd9b5;--k4:#8cc8ff;--k5:#ffe27a;--k6:#e8e8e8}
html[data-cb=on][data-theme=slate]{--c1:#56B4E9;--good:#56B4E9;--bad:#E69F00;--acc:#0072B2}
html[data-cb=on][data-theme=slate] .btn.on,html[data-cb=on][data-theme=slate] .si.on{background:#0072B2}

/* ================= v2: shell ================= */
html,body{height:100%}
body{overflow:hidden;background:var(--bg) var(--bgimg) 0 0/26px 26px;font-size:16px}
#shell{display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:58px minmax(0,1fr);height:100vh;height:100dvh;position:relative}
.top{grid-column:1/3;flex-wrap:nowrap;gap:12px;padding:6px 14px;background:var(--side);border-bottom:var(--bw) solid var(--line);z-index:5}
.top .grow1{flex:1}
.brand{font-size:1.4rem}
.hud{gap:8px}
.xpwrap{min-width:110px}
#menuBtn{display:none}
#side{grid-row:2;grid-column:1;background:var(--side);border-right:var(--bw) solid var(--line);padding:10px 10px 14px;overflow:auto;display:flex;flex-direction:column;gap:2px;z-index:20;transition:transform .25s}
.stitle{font-size:.7rem;letter-spacing:.14em;color:var(--muted);font-weight:700;margin:12px 8px 4px}
.sh,.si{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;background:transparent;color:var(--ink);padding:8px 10px;border-radius:10px;cursor:pointer;font-size:.93rem;font-weight:500}
.sh{font-weight:700}.sh i{margin-left:auto;font-style:normal;color:var(--muted)}
.si{padding-left:28px}.si.u{padding-left:10px}
.sh:hover,.si:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.si.on{background:var(--acc);color:#fff;font-weight:600}
.sfoot{margin-top:auto;padding:10px 8px 0;font-size:.78rem;color:var(--muted)}
#work{grid-row:2;grid-column:2;display:flex;min-width:0;min-height:0}
#work main{flex:1;min-width:0;min-height:0;max-width:none;margin:0;padding:14px;overflow:auto}
.page.active{display:flex;flex-direction:column;height:100%;min-height:0}
.card{margin-bottom:0}
.card h2{font-size:1.2rem;margin:.1em 0 .4em}
.card h3{font-size:1rem}
.col{display:flex;flex-direction:column;min-height:0}
.scrolly{overflow:auto}
.grow{flex:1;min-height:200px;position:relative}
.grow canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
canvas#parab{aspect-ratio:auto}
.gwrap.grow{background-image:none}
.lhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.lhead .ltitle{font-size:1.3rem;font-weight:700;margin-right:auto}
.lov,.llab{flex:1;min-height:0}
.llab{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);gap:14px;overflow:hidden}
.llab>.card{min-height:0}
.llab.one{grid-template-columns:minmax(0,1fr)}
.lctl{display:none}
.lov{overflow:auto}
.page.stage-ov .llab{display:none}
.page.stage-lab .lov{display:none}
.ovcard{height:100%;display:grid;grid-template-columns:minmax(250px,1fr) minmax(0,2.1fr);gap:18px;overflow:auto}
.ovl{display:flex;flex-direction:column;gap:12px}
.ovl .mas{display:inline-block}
.ovl p{margin:0;color:var(--muted);line-height:1.5}
.ovseg{display:flex;flex-direction:column;gap:8px}
.takeaways{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.takeaways li{padding:12px 14px 12px 42px;position:relative;background:var(--paper);border:var(--bw) solid var(--line);border-radius:12px;line-height:1.4}
.takeaways li::before{content:'';position:absolute;left:12px;top:10px;width:22px;height:22px;border-radius:50%;background:var(--c4);color:#06281a;font-weight:800;text-align:center;line-height:22px;font-size:.9rem}
.lov #podCard h2,.lov #podLesson{display:none}
.lov #podCard{box-shadow:none;border:none;padding:0;background:transparent}
.pgrid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;height:100%;min-height:0}
#podList{display:flex;flex-direction:column;gap:8px;overflow:auto}
#podList button{text-align:left}
.pgrid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:14px;height:100%;min-height:0}
#page-practice .pad{height:auto;flex:1;min-height:200px}
.tools{margin:10px 0 0;gap:8px}
.sw2{display:inline-flex;gap:6px;align-items:center}
.sw2 button{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw2 button.on{outline:3px solid var(--acc);outline-offset:2px}
.sw2.sz button{background:var(--ink);border-radius:50%}
.tips{margin:12px 0 0;color:var(--muted);font-size:.9rem;line-height:1.5}
.rkgrid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;height:100%;min-height:0}
.rkgrid>.card{overflow:auto}
.lb{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:8px}
.lrow{padding:6px 10px;grid-template-columns:34px 44px 1fr auto}
.evo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;text-align:center}
.evo small{display:block;font-size:.72rem;color:var(--muted);line-height:1.2}
.evo .lock{opacity:.35;filter:grayscale(1)}
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;align-content:start}
.setgrid .set input[type=text]{border:var(--bw) solid var(--line);border-radius:10px;padding:5px 9px;background:var(--card);width:150px}
.spill{display:flex;flex-direction:column}

/* ---- header mode switch ---- */
.modesw{display:flex;gap:2px;padding:3px;border-radius:14px;border:var(--bw) solid var(--line);background:var(--card)}
.modesw button{border:none;background:transparent;color:var(--ink);padding:6px 12px;border-radius:11px;font-weight:600;cursor:pointer;font-size:.88rem;white-space:nowrap}
.modesw button.on{background:var(--acc);color:#fff;box-shadow:0 2px 10px color-mix(in srgb,var(--acc) 55%,transparent)}

/* ---- phone dock (hybrid) ---- */
#phoneDock{display:none;flex:0 0 312px;width:312px;padding:12px 14px 12px 0;align-items:center;justify-content:center;perspective:1000px}
body.mode-hybrid #phoneDock{display:flex}
.phone{width:280px;height:min(590px,calc(100vh - 100px));border-radius:38px;border:9px solid #05060d;background:var(--bg);box-shadow:0 24px 50px rgba(0,0,0,.45),inset 0 0 0 2px #2a2d44;position:relative;display:flex;flex-direction:column;overflow:hidden;transition:transform .12s linear}
.phone .notch{position:absolute;top:0;left:50%;width:90px;height:20px;margin-left:-45px;background:#05060d;border-radius:0 0 14px 14px;z-index:3}
#phoneScreen{flex:1;overflow:auto;padding:26px 12px 12px}
.pui{display:flex;flex-direction:column;gap:12px}
.phead{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:.9rem}
.live{width:10px;height:10px;border-radius:50%;background:var(--muted);display:inline-block}
.live.on{background:var(--good);box-shadow:0 0 8px var(--good);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.plab{font-size:1.05rem;font-weight:700}
.pnone{color:var(--muted);line-height:1.5;font-size:.9rem}
.pshort{display:flex;flex-direction:column;gap:8px}
.pprev{width:100%;height:170px;border:var(--bw) solid var(--line);border-radius:12px;background:var(--paper)}
.prow{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;align-items:center}
.psl{display:flex;flex-direction:column;gap:10px}
.ps label{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-weight:600}
.ps input{margin-top:4px}
.knob{width:100px;height:100px;position:relative;touch-action:none;cursor:grab;user-select:none}
.knob svg{width:100%;height:100%;display:block}
.knob .kv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;pointer-events:none}
.kl{text-align:center;font-size:.8rem;color:var(--muted);font-weight:600;margin-top:2px}
.ptilt{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center}
.tilt{position:relative;width:120px;height:120px;border-radius:50%;border:var(--bw) solid var(--line);background:radial-gradient(circle,var(--paper),var(--card));touch-action:none;cursor:grab}
.tilt::before,.tilt::after{content:'';position:absolute;background:var(--line);opacity:.6}
.tilt::before{left:50%;top:6%;bottom:6%;width:1px}.tilt::after{top:50%;left:6%;right:6%;height:1px}
.tilt i{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;border-radius:50%;background:var(--c2);border:2px solid var(--line);box-shadow:0 3px 8px rgba(0,0,0,.4)}
.pbtn{display:flex;flex-direction:column;gap:6px}
.pbtn .btn{font-size:.78rem;padding:5px 8px}

/* ---- phone mode (full phone UI) ---- */
body.mode-phone{background:radial-gradient(circle at 50% 0,#2b3070,#080914)}
body.mode-phone #shell{width:min(430px,100vw);margin:0 auto;grid-template-columns:minmax(0,1fr);overflow:hidden;background:var(--bg)}
@media(min-width:600px){body.mode-phone #shell{height:calc(100dvh - 24px);margin:12px auto;border-radius:34px;border:9px solid #05060d;box-shadow:0 30px 70px rgba(0,0,0,.55)}}
body.mode-phone .top{grid-column:1}
body.mode-phone #work{grid-column:1}
body.mode-phone #phoneDock{display:none}
body.mode-phone #menuBtn{display:inline-block}
body.mode-phone .xpwrap,body.mode-phone .brand b,body.mode-phone #hudAv,body.mode-phone .modesw button span{display:none}
body.mode-phone .modesw button{padding:6px 8px}
body.mode-phone #work main{padding:10px}
body.mode-phone .llab{display:flex;flex-direction:column;overflow:auto}
body.mode-phone .ovcard,body.mode-phone .pgrid,body.mode-phone .pgrid2,body.mode-phone .rkgrid{display:flex;flex-direction:column;height:auto}
body.mode-phone .page.ctlable.stage-lab .llab>.card{display:none}
body.mode-phone .page.ctlable.stage-lab .lctl{display:block}
body.mode-phone .lctl .prow{grid-template-columns:110px minmax(0,1fr)}
body.mode-phone .lctl .pprev{height:210px}
body.mode-phone .setgrid{grid-template-columns:1fr}
body.mode-phone .lb{grid-template-columns:1fr}
body.mode-phone .page.active{height:auto;min-height:100%}
body.mode-phone #side,body.mode-phone-never{position:absolute;left:0;top:58px;bottom:0;width:250px;transform:translateX(-102%);box-shadow:8px 0 30px rgba(0,0,0,.45)}
body.mode-phone.drawer #side{transform:none}

/* ---- theme-aware component refinements ---- */
.btn{background:var(--btn);color:var(--btnink)}
.btn.on,nav .btn.on{background:var(--acc);color:#fff}
.btn.big,.btn.pink,.btn.blue,.btn.orange{color:#1a1633}
.btn.big{background:var(--c4)}.btn.pink{background:var(--c2)}.btn.blue{background:var(--c6)}.btn.orange{background:var(--c5)}
.badge{color:#1a1633}
html:not([data-theme^=play]) .btn{border-radius:10px}
html:not([data-theme^=play]) .btn:hover,html:not([data-theme^=play]) .lrow:hover,html:not([data-theme^=play]) .vcard:hover{transform:translateY(-1px) rotate(0)}
html:not([data-theme^=play]) .btn:active{transform:translateY(1px);box-shadow:none}
html:not([data-theme^=play]) .tile,html:not([data-theme^=play]) .stu{border-radius:12px}
html:not([data-theme^=play]) .t1,html:not([data-theme^=play]) .k0,html:not([data-theme^=play]) .podium .p1{background:color-mix(in srgb,var(--c3) 24%,var(--card));color:var(--ink)}
html:not([data-theme^=play]) .t2,html:not([data-theme^=play]) .k1,html:not([data-theme^=play]) .podium .p2{background:color-mix(in srgb,var(--c6) 24%,var(--card));color:var(--ink)}
html:not([data-theme^=play]) .t3,html:not([data-theme^=play]) .k2,html:not([data-theme^=play]) .podium .p3{background:color-mix(in srgb,var(--c4) 24%,var(--card));color:var(--ink)}
html:not([data-theme^=play]) .t4,html:not([data-theme^=play]) .k3{background:color-mix(in srgb,var(--c2) 24%,var(--card));color:var(--ink)}
html:not([data-theme^=play]) .k4{background:color-mix(in srgb,var(--c5) 24%,var(--card));color:var(--ink)}
html:not([data-theme^=play]) .k5{background:color-mix(in srgb,var(--c1) 24%,var(--card));color:var(--ink)}
html:not([data-theme^=play]) .stu .meta span{background:color-mix(in srgb,var(--ink) 10%,transparent);color:var(--ink)}
html:not([data-theme^=play]) .up{color:var(--good)}html:not([data-theme^=play]) .down{color:var(--bad)}
html:not([data-theme^=play]) .slot.full{background:color-mix(in srgb,var(--c4) 28%,var(--card));color:var(--ink)}
html:not([data-theme^=play]) .boardwrap{border:var(--bw) solid var(--line);border-radius:14px}
html:not([data-theme^=play]) .qbox,html:not([data-theme^=play]) .bubble{border-style:solid}
html:not([data-theme^=play]) .vcard .end{background:var(--card)}
html:not([data-theme^=play]) .gwrap{border-radius:12px}
.mbody{border-width:var(--bw)}
.sl b{font-family:var(--hand)}
.formula{font-size:1.5rem}

/* ---- responsive ---- */
@media(max-width:1180px){body.mode-hybrid #phoneDock{position:fixed;right:8px;bottom:8px;z-index:40;width:auto;flex:none;padding:0;transform:scale(.72);transform-origin:bottom right}}
@media(max-width:900px){
 #shell{grid-template-columns:minmax(0,1fr)}
 .top{grid-column:1}#work{grid-column:1}
 #menuBtn{display:inline-block}
 #side{position:absolute;left:0;top:58px;bottom:0;width:250px;transform:translateX(-102%);box-shadow:8px 0 30px rgba(0,0,0,.45)}
 body.drawer #side{transform:none}
 .xpwrap,.brand b{display:none}
 .llab{display:flex;flex-direction:column;overflow:auto}
 .ovcard,.pgrid,.pgrid2,.rkgrid{display:flex;flex-direction:column;height:auto}
 .page.active{height:auto}
 .grow{flex:none;height:300px}
 .modesw button span{display:none}
 .setgrid{grid-template-columns:1fr}
}

/* ================= v2: extras ================= */
.page.active>.pgrid,.page.active>.pgrid2,.page.active>.rkgrid{flex:1;min-height:0}
.page.active>.setgrid{overflow:auto;flex:1;min-height:0;padding:0 6px 6px 0}
.llab{padding:0 6px 6px 0}
.ovl .mas svg{width:76px;height:76px}
.ovr{min-height:0}
.podslot{min-height:0}
.lhead .modesw button{padding:6px 14px}
.toast{background:var(--acc)}
.knob{position:relative}
.mb{display:inline-flex}
.lctl{padding:2px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.themebtn{cursor:pointer;border:var(--bw) solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px;text-align:center;font-weight:600;font-size:.82rem}
.themebtn.on{outline:3px solid var(--acc);outline-offset:1px}
.themebtn .pv{display:flex;height:26px;border-radius:8px;overflow:hidden;margin-bottom:6px;border:1px solid rgba(128,128,128,.4)}
.themebtn .pv i{flex:1}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.fc{perspective:700px;height:124px;cursor:pointer;position:relative}
.fi{position:absolute;inset:0;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fi{transform:rotateY(180deg)}
.ff,.fbk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:var(--bw) solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--paper);box-shadow:var(--shadow)}
.fbk{transform:rotateY(180deg);background:color-mix(in srgb,var(--c4) 25%,var(--card));font-weight:600;font-size:1.1rem;text-align:center;padding:6px}
.ff .emo{font-size:2rem}.ff .word{font-size:1.25rem;font-weight:700}
.qopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.qbig{font-size:3rem;text-align:center;line-height:1.1}
.qbig small{display:block;font-size:1.4rem;font-weight:700;margin-top:4px}
input.code{width:100%;border:var(--bw) solid var(--line);border-radius:10px;padding:6px 9px;background:var(--card);font-size:.8rem;font-family:monospace}
.note{font-size:.82rem;color:var(--muted);line-height:1.4;margin:6px 0 0}
body.mode-phone .grow{flex:none;height:300px}
html:not([data-theme^=play]) :is(.sw,.xpbar,.streak,.tile,.gwrap,.pad,.stu,.lrow,.vcard,.slot,.qbox,.bubble,input[type=range],select,.sel,.recog input,.echip,.mbody,.btn,.takeaways li,.fc .ff,.fc .fbk){border-width:var(--bw)}
html:not([data-theme^=play]) :is(.lrow,.vcard,.stu,.tile,.echip,.streak){box-shadow:var(--shadow)}
html:not([data-theme^=play]) .btn{box-shadow:none}
html:not([data-theme^=play]) .btn.big,html:not([data-theme^=play]) .btn.pink,html:not([data-theme^=play]) .btn.blue,html:not([data-theme^=play]) .btn.orange{box-shadow:0 1px 0 rgba(0,0,0,.2)}
html:not([data-theme^=play]) .vcard .end,html:not([data-theme^=play]) .slot.full .drop{color:var(--c2)}
html:not([data-theme^=play]) .vcard:hover{transform:translateY(-2px)}
html:not([data-theme^=play]) .badge{animation:none}
[data-theme=light] .btn.big,[data-theme=light] .btn.pink,[data-theme=light] .btn.blue,[data-theme=light] .btn.orange{color:#101533}
.ovcard{grid-template-columns:minmax(300px,1fr) minmax(0,2fr)}
.ovseg .modesw{flex-wrap:wrap}
.ovseg .modesw button{font-size:.85rem;padding:6px 10px}

/* ================= v3: editorial themes ================= */
[data-theme=slate]{--bg:#0c0d10;--paper:#121318;--card:#101115;--rule:#1d2028;--line:#262a33;--ink:#ecebe6;--muted:#8a8c94;--sh:transparent;--side:#0c0d10;--acc:#ff6a3d;--btn:transparent;--btnink:#ecebe6;--grid:rgba(255,255,255,.035);--c1:#9aa8ff;--pen:#ecebe6;--board:#14161c;--shadow:none;--r:4px;--bw:1px;--font:'Inter',system-ui,sans-serif;--disp:'Instrument Serif',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,monospace;--hand:'Instrument Serif',Georgia,serif}
[data-theme=light]{--bg:#f3f1ec;--paper:#faf9f6;--card:#fbfaf7;--rule:#e6e2da;--line:#d9d5cc;--ink:#121212;--muted:#6e6b64;--sh:transparent;--side:#f3f1ec;--acc:#ff4f1f;--btn:transparent;--btnink:#121212;--grid:rgba(0,0,0,.045);--pen:#1a1a1a;--board:#1c2420;--shadow:none;--r:4px;--bw:1px;--font:'Inter',system-ui,sans-serif;--disp:'Instrument Serif',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,monospace;--hand:'Instrument Serif',Georgia,serif}
[data-theme^=play]{--disp:'Fredoka',sans-serif;--mono:'Fredoka',sans-serif;--grid:transparent}
[data-theme=playdark]{--bg:#15112b;--bgimg:radial-gradient(#241d48 2px,transparent 2.5px);--paper:#221c42;--rule:#3a3470;--ink:#f3eeff;--card:#2a2354;--line:#a99aff;--sh:#05030f;--muted:#b3a9e6;--c1:#9b85ff;--c2:#ff6fb5;--c3:#ffd84d;--c4:#3ddc97;--c5:#ff8a3d;--c6:#4cc9f0;--good:#43e08d;--bad:#ff6b88;--pen:#ffe27a;--acc:#7c5cff;--btn:#ffd84d;--btnink:#2b2350;--board:#0f1d2e;--k1:#fffbe8;--k2:#ffa6d1;--k3:#9bf0c8;--k4:#8fdcff;--k5:#ffc78a;--k6:#d4c6ff;--bw:3px;--shadow:5px 5px 0 var(--sh);--r:20px 28px 22px 30px/28px 20px 30px 22px;--font:'Fredoka','Trebuchet MS',system-ui,sans-serif;--hand:'Patrick Hand','Segoe Print',cursive;--side:#1b1636}
html:not([data-theme^=play]) body{background:var(--bg)}
html:not([data-theme^=play]) #work main{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:64px 64px;padding:20px 24px}
html:not([data-theme^=play]) :is(h2,.ltitle,.plab,.qbig small,.ovl>div:nth-child(2)){font-family:var(--disp);font-weight:400;letter-spacing:-.01em}
html:not([data-theme^=play]) .card h2{font-size:1.7rem;line-height:1.05}
html:not([data-theme^=play]) .lhead{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
html:not([data-theme^=play]) .lhead .ltitle{font-size:2.1rem;line-height:1}
html:not([data-theme^=play]) :is(.stitle,.tile small,.kl,.ps label,.xpwrap small,.sfoot,.evo small,.streak,.netpill,.lhead small){font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;font-size:.66rem}
html:not([data-theme^=play]) .brand{font-family:var(--disp);font-weight:400;font-size:1.6rem;letter-spacing:0}
html:not([data-theme^=play]) .brand b{background:none;color:var(--ink)}
html:not([data-theme^=play]) .brand::before{content:'';width:9px;height:9px;background:var(--acc)}
html:not([data-theme^=play]) :is(#logo,.ovl .mas,.bubble .mb){display:none}
html:not([data-theme^=play]) .card{border-radius:4px;box-shadow:none;padding:20px}
html:not([data-theme^=play]) .btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:3px;font-weight:500;font-size:.88rem;letter-spacing:.01em}
html:not([data-theme^=play]) .btn:hover{border-color:var(--ink)}
html:not([data-theme^=play]) :is(.btn.on,.btn.big,nav .btn.on){background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:none}
html:not([data-theme^=play]) .btn.pink{background:transparent;color:var(--ink);box-shadow:inset 3px 0 0 var(--c2)}
html:not([data-theme^=play]) .btn.blue{background:transparent;color:var(--ink);box-shadow:inset 3px 0 0 var(--c6)}
html:not([data-theme^=play]) .btn.orange{background:transparent;color:var(--ink);box-shadow:inset 3px 0 0 var(--c5)}
html:not([data-theme^=play]) .tile{background:transparent!important;border:1px solid var(--line);border-radius:3px;box-shadow:inset 0 2px 0 var(--c3);color:var(--ink)}
html:not([data-theme^=play]) .t2{box-shadow:inset 0 2px 0 var(--c6)}html:not([data-theme^=play]) .t3{box-shadow:inset 0 2px 0 var(--c4)}html:not([data-theme^=play]) .t4{box-shadow:inset 0 2px 0 var(--c2)}
html:not([data-theme^=play]) .tile b{font-family:var(--disp);font-weight:400;font-size:1.35rem}
html:not([data-theme^=play]) .modesw{border-radius:4px;padding:2px}
html:not([data-theme^=play]) .modesw button{border-radius:3px;font-weight:500}
html:not([data-theme^=play]) .modesw button.on{background:var(--ink);color:var(--bg);box-shadow:none}
html:not([data-theme^=play]) :is(.si,.sh){border-radius:3px}
html:not([data-theme^=play]) .si.on{background:transparent;color:var(--ink);box-shadow:inset 2px 0 0 var(--acc);border-radius:0;font-weight:600}
html:not([data-theme^=play]) .xpbar{height:3px;border:0;border-radius:0;background:var(--rule)}
html:not([data-theme^=play]) .xpbar i{background:var(--acc)}
html:not([data-theme^=play]) .streak{border-radius:3px;box-shadow:none;padding:5px 9px}
html:not([data-theme^=play]) .takeaways{counter-reset:k}
html:not([data-theme^=play]) .takeaways li{counter-increment:k;background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:14px 0 14px 44px}
html:not([data-theme^=play]) .takeaways li::before{content:counter(k,decimal-leading-zero);background:none;color:var(--acc);font-family:var(--mono);font-size:.72rem;width:auto;left:0;top:16px;line-height:1}
html:not([data-theme^=play]) .pad{background:repeating-linear-gradient(transparent 0 35px,var(--rule) 35px 36px),var(--paper);border-radius:4px;box-shadow:none}
html:not([data-theme^=play]) .qbox{border-radius:3px;font-family:var(--disp);font-size:2rem}
html:not([data-theme^=play]) .bubble{border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;padding:12px 0 0}
html:not([data-theme^=play]) input[type=range]{height:2px;border:0;background:var(--line);border-radius:0}
html:not([data-theme^=play]) input[type=range]::-webkit-slider-thumb{width:16px;height:16px;border:0;background:var(--ink)}
html:not([data-theme^=play]) input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;background:var(--ink)}
html:not([data-theme^=play]) :is(.lrow,.fc .ff,.fc .fbk,.stu,select,.sel,.themebtn,.mbody){border-radius:4px;box-shadow:none}

:root{--gam:#FF6A13;--gam-h:#FF7F32;--gam-p:#E85A08;--gam-ink:#2B2018;--gam-t:rgba(255,106,19,.16);--err:#E5484D;--acc-ink:#fff}
[data-theme=tiramisu]{--bg:#171513;--paper:#1c1916;--card:#211E1A;--side:#171513;--rule:#2E2A24;--line:#2E2A24;--ink:#EDE3D0;--muted:#A89F8E;--sh:transparent;--acc:#D9C3A0;--acc-ink:#2B2018;--btn:transparent;--btnink:#EDE3D0;--grid:rgba(237,227,208,.03);--pen:#EDE3D0;--board:#1f1c18;--shadow:none;--r:4px;--bw:1px;
--c1:#b9a6d9;--c2:#d98c6a;--c3:#D9C3A0;--c4:#8fb59a;--c5:#FF6A13;--c6:#8aa9c4;--good:#8fb59a;--bad:#E5484D;--k1:#EDE3D0;--k2:#d98c6a;--k3:#8fb59a;--k4:#8aa9c4;--k5:#D9C3A0;--k6:#b9a6d9;
--font:'Inter',system-ui,sans-serif;--disp:'Instrument Serif',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,monospace;--hand:'Instrument Serif',Georgia,serif}
[data-theme=slate]{--acc-ink:#0d0e12}[data-theme=light]{--acc-ink:#fff}
html .pdots button.cur,html .bar i,html .tilt i,html .echip{color:var(--acc-ink)}
/* header: XP + theme only */
#hudAv,#qLang,#netPill,#modesw,#hudStreak,#menuBtn:empty{display:none!important}
body.mode-phone #menuBtn{display:inline-flex!important}
.xpbar i{background:var(--gam)!important}
/* sidebar: icons, collapsible, muted tint */
#side .si,#side .sh{display:flex;align-items:center;justify-content:flex-start;gap:10px;text-align:left;width:100%}
#side .sh{padding-left:14px!important}#side .si{padding-left:24px!important}
.ovseg .segc button{padding:8px 10px;font-size:.82rem}
#side .si .ic,#side .sh .ic{width:16px;height:16px;opacity:.85}
#side .si.on{background:color-mix(in srgb,var(--acc) 14%,transparent)!important;box-shadow:none!important;border-radius:4px!important;color:var(--ink)}
#side .sh i:last-child{margin-left:auto;font-style:normal;color:var(--muted);font-size:.7rem}
.sidecol{margin-top:auto;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--muted);padding:8px 14px;cursor:pointer;font:inherit;font-size:.8rem}
.sidecol:hover{color:var(--ink)}
body.side-mini #shell{grid-template-columns:60px minmax(0,1fr)}
body.side-mini #side{padding:10px 6px}
body.side-mini #side :is(.stitle,.sfoot,.lbl,.sh>i:last-child,.si:not(.u)){display:none!important}
body.side-mini #side .sh{grid-template-columns:16px!important;justify-content:center;padding:0!important;height:32px}
body.side-mini #side :is(.si,.sh,.sidecol){justify-content:center;padding:10px 0}
body.side-mini .sidecol .ic{transform:scaleX(-1)}
/* shared segmented control */
.segc{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card);isolation:isolate}
.segc .segk{position:absolute;z-index:-1;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));border-radius:999px;background:color-mix(in srgb,var(--acc) 18%,var(--card));border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);transform:translateX(calc(100% * var(--i)));transition:transform .28s cubic-bezier(.3,.7,.2,1)}
.segc button{display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:transparent;color:var(--muted);padding:8px 16px;border-radius:999px;font:500 .88rem var(--font);cursor:pointer;white-space:nowrap}
.segc button[aria-selected=true]{color:var(--ink)}
.segc button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.lhead .segc{margin-left:auto}
.ovseg .segc{width:100%}
.labpill{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:999px;background:var(--acc);color:var(--acc-ink);font:600 1rem var(--font);padding:13px 22px;cursor:pointer;transition:filter .15s,transform .15s}
.labpill:hover{filter:brightness(1.07)}.labpill:active{transform:scale(.98)}
.labmeta{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);font:500 .74rem var(--mono);letter-spacing:.06em;text-transform:uppercase}
/* leaderboard */
html .lrow{background:var(--card)!important;border:1px solid var(--line)!important;box-shadow:none!important;color:var(--ink)}
html .lrow .rk{font:500 1rem var(--mono);color:var(--muted)}
html .lrow:nth-child(-n+3) .rk{position:relative}
html .lrow:nth-child(-n+3) .rk::after{content:'';position:absolute;left:50%;bottom:-6px;width:14px;height:2px;margin-left:-7px;background:var(--medal)}
html .lrow:nth-child(1){--medal:#D4AF37}html .lrow:nth-child(2){--medal:#B8BEC6}html .lrow:nth-child(3){--medal:#B87333}
html .lrow .bar i{background:var(--gam)!important}
html .stu{background:var(--card)!important;border:1px solid var(--line)!important;box-shadow:none!important;color:var(--ink)!important}
html .stu:nth-of-type(1){--medal:#D4AF37}html .stu:nth-of-type(2){--medal:#B8BEC6}html .stu:nth-of-type(3){--medal:#B87333}
html .stu .medal{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--medal);margin-right:6px;vertical-align:1px}
html .podium>div{background:var(--card)!important;border:1px solid var(--line)!important;color:var(--ink)!important;box-shadow:none!important}
html .podium .p1{box-shadow:inset 0 2px 0 #D4AF37!important}html .podium .p2{box-shadow:inset 0 2px 0 #B8BEC6!important}html .podium .p3{box-shadow:inset 0 2px 0 #B87333!important}
html .badge{background:var(--gam-t)!important;color:var(--gam)!important;border:1px solid color-mix(in srgb,var(--gam) 50%,transparent)!important;animation:none!important}
.btn.gam{background:var(--gam)!important;color:var(--gam-ink)!important;border-color:var(--gam)!important;font-weight:600}
.btn.gam:hover{background:var(--gam-h)!important}.btn.gam:active{background:var(--gam-p)!important}
.btn.gam.ghost{background:transparent!important;color:var(--gam)!important}
/* challenge sheet */
#modal.sheet{align-items:flex-end}
#modal.sheet .mbody{width:min(560px,100%);border-radius:14px 14px 0 0!important;animation:sheetIn .3s cubic-bezier(.3,.7,.2,1)}
@keyframes sheetIn{from{transform:translateY(40px);opacity:0}}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;text-align:center;margin:18px 0}
.vs .who b{display:block;margin-top:6px}.vs .who small{color:var(--muted)}
.vs .x{font:500 .8rem var(--mono);color:var(--gam);letter-spacing:.1em}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 16px}
.rules div{border:1px solid var(--line);border-radius:6px;padding:10px;text-align:center}
.rules b{display:block;font:400 1.4rem var(--disp)}.rules small{color:var(--muted);font:500 .66rem var(--mono);text-transform:uppercase;letter-spacing:.08em}
.race{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.race .ln{display:grid;grid-template-columns:90px 1fr 56px;gap:10px;align-items:center;margin:8px 0;font-size:.85rem}
.race .tr{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}.race .tr i{display:block;height:100%;background:var(--gam);transition:width .5s}
.race .tr.op i{background:var(--muted)}
.race .ln b{text-align:right;font-family:var(--mono);font-weight:500}
.race h3{display:flex;align-items:center;gap:8px}
/* developer panel */
#devPanel{position:fixed;right:14px;top:70px;width:300px;max-height:calc(100vh - 90px);overflow:auto;z-index:60;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.35);font-size:.84rem}
#devPanel[hidden]{display:none}
#devPanel h4{margin:14px 0 6px;font:500 .66rem var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
#devPanel .dseg{display:flex;flex-wrap:wrap;gap:4px}
#devPanel .dseg button,#devPanel .db{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:4px;padding:5px 9px;font:inherit;cursor:pointer}
#devPanel .dseg button.on{background:var(--ink);color:var(--bg)}
#devPanel pre{margin:0;font:400 .72rem var(--mono);color:var(--muted);white-space:pre-wrap}
#devPanel label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:5px 0}
body.hyb-float #phoneDock{position:fixed!important;right:14px;bottom:14px;z-index:45;width:auto!important;flex:none!important;padding:0!important;transform:scale(.7);transform-origin:bottom right}
body.hyb-float #shell{grid-template-columns:236px minmax(0,1fr)!important}
.tdot{position:fixed;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2px solid var(--acc);background:color-mix(in srgb,var(--acc) 25%,transparent);pointer-events:none;z-index:99;animation:tdot .5s forwards}
@keyframes tdot{to{transform:scale(1.6);opacity:0}}
body.present #devPanel{display:none!important}
body.present{font-size:112%}
body.present :is(#qTheme,.themes,[data-l]){pointer-events:none;opacity:.5}

/* ===== v5.1 fixes ===== */
.ovseg .segc{width:100%;max-width:100%}.ovseg .segc button{min-width:0;padding:8px 10px}
.segc button{min-width:0;overflow:hidden;text-overflow:ellipsis}
.setgrid{grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr))!important}
.setgrid .card{min-width:0}
.set{grid-template-columns:minmax(0,1fr) minmax(0,auto)!important}
.set:has(select){grid-template-columns:auto minmax(0,1fr)!important}
.set select,#selVoice{width:100%;min-width:0;max-width:100%}
html input[type=range]{-webkit-appearance:none;appearance:none;height:4px!important;border:0!important;border-radius:2px!important;background:linear-gradient(to right,var(--acc) var(--p,50%),var(--line) var(--p,50%))!important}
html input[type=range]::-moz-range-track{height:4px;background:transparent}
html .sw{border:1px solid var(--muted)!important;background:color-mix(in srgb,var(--muted) 18%,transparent)!important}
html .sw::after{background:var(--muted)!important;top:3px}
html .sw.on{background:var(--acc)!important;border-color:var(--acc)!important}html .sw.on::after{background:var(--acc-ink)!important}
/* ===== B: sidebar on a 4/8/12/16 scale ===== */
#side{padding:12px 8px!important;gap:4px!important}
#side .stitle{padding:12px 12px 4px!important;margin:0!important}
#side .sh,#side .si,#side .sidecol{display:grid!important;grid-template-columns:16px minmax(0,1fr) 16px;align-items:center;column-gap:12px;height:32px;padding:0 12px!important;margin:0!important;border-radius:4px!important;text-align:left;width:100%}
#side .si{padding-left:24px!important;grid-template-columns:16px minmax(0,1fr)}
#side .sh{font-weight:600}
#side .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#side .sh>i:last-child{width:16px;text-align:center;font-size:12px;line-height:1;justify-self:center}
#side .ic{width:16px!important;height:16px!important;justify-self:center}
#side .sidecol{margin-top:auto!important}
#side .sfoot{padding:8px 12px 0!important}
body.side-mini #shell{grid-template-columns:56px minmax(0,1fr)!important}
body.side-mini #side{padding:12px 8px!important}
body.side-mini #side :is(.si,.sidecol){grid-template-columns:16px!important;justify-content:center;padding:0!important;height:32px}
body.side-mini #side{gap:8px!important}
#side .si.u{padding-left:12px!important;grid-template-columns:16px minmax(0,1fr) 16px}

/* ===== C: palette x mode (6 themes) ===== */
[data-theme=tiramisu-dark]{--bg:#171513;--side:#171513;--paper:#1c1916;--alt:#1c1916;--card:#211E1A;--rule:#2E2A24;--line:#2E2A24;--ink:#EDE3D0;--muted:#A89F8E;--acc:#D9C3A0;--acc-h:#E6D3B4;--acc-ink:#2B2018;--btnink:#EDE3D0;--pen:#EDE3D0;--board:#1f1c18;--grid:color-mix(in srgb,#EDE3D0 3%,transparent);--sh:transparent;--btn:transparent;--shadow:none;--r:4px;--bw:1px;--c1:#b9a6d9;--c2:#d98c6a;--c3:#D9C3A0;--c4:#8fb59a;--c5:#FF6A13;--c6:#8aa9c4;--good:#8fb59a;--bad:#E5484D;--scrim:rgba(0,0,0,.6);--device:#050505;--device-2:#2a2a2a;--k1:#F3ECDF;--k2:#F2A98F;--k3:#9FD4B4;--k4:#9CC3E6;--k5:#E7CFA6;--k6:#CDBDEB;--font:'Inter',system-ui,sans-serif;--disp:'Instrument Serif',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,monospace;--hand:'Instrument Serif',Georgia,serif;color-scheme:dark}
[data-theme=tiramisu-light]{--bg:#F6F0E6;--side:#F6F0E6;--paper:#EFE6D6;--alt:#EFE6D6;--card:#FFFBF4;--rule:#DDD0BC;--line:#DDD0BC;--ink:#2B2018;--muted:#6E6253;--acc:#8C6838;--acc-h:#74552C;--acc-ink:#FFF8EE;--btnink:#2B2018;--pen:#2B2018;--board:#1f1c18;--grid:color-mix(in srgb,#2B2018 4%,transparent);--sh:transparent;--btn:transparent;--shadow:none;--r:4px;--bw:1px;--c1:#6b5ca5;--c2:#c4553a;--c3:#b08a55;--c4:#3f8f63;--c5:#E85A08;--c6:#3d7aa8;--good:#2f7d55;--bad:#C4383D;--scrim:rgba(20,14,10,.45);--device:#1b1b1b;--device-2:#3a3a3a;--k1:#F3ECDF;--k2:#F2A98F;--k3:#9FD4B4;--k4:#9CC3E6;--k5:#E7CFA6;--k6:#CDBDEB;--font:'Inter',system-ui,sans-serif;--disp:'Instrument Serif',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,monospace;--hand:'Instrument Serif',Georgia,serif;color-scheme:light}

[data-theme=coral-light]{--bg:#FFF5F2;--side:#FFF5F2;--paper:#FFE8E1;--alt:#FFE8E1;--card:#FFFFFF;--rule:#F3CFC6;--line:#F3CFC6;--ink:#2B1A18;--muted:#7A5F59;--acc:#FF6F61;--acc-h:#E85A4C;--acc-ink:#2B1A18;--btnink:#2B1A18;--pen:#2B1A18;--board:#241816;--grid:color-mix(in srgb,#2B1A18 4%,transparent);--sh:transparent;--btn:transparent;--shadow:none;--r:4px;--bw:1px;--c1:#6b5ca5;--c2:#c4553a;--c3:#b08a55;--c4:#3f8f63;--c5:#E85A08;--c6:#3d7aa8;--good:#2f7d55;--bad:#C4383D;--scrim:rgba(20,14,10,.45);--device:#1b1b1b;--device-2:#3a3a3a;--k1:#F3ECDF;--k2:#F2A98F;--k3:#9FD4B4;--k4:#9CC3E6;--k5:#E7CFA6;--k6:#CDBDEB;--font:'Inter',system-ui,sans-serif;--disp:'Instrument Serif',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,monospace;--hand:'Instrument Serif',Georgia,serif;color-scheme:light}

[data-theme=mint-light]{--bg:#F2FAF9;--side:#F2FAF9;--paper:#DDF1EE;--alt:#DDF1EE;--card:#FFFFFF;--rule:#BFE0DB;--line:#BFE0DB;--ink:#0F2523;--muted:#4F6F6A;--acc:#0F766E;--acc-h:#0B5D57;--acc-ink:#FFFFFF;--btnink:#0F2523;--pen:#0F2523;--board:#0f1c1b;--grid:color-mix(in srgb,#0F2523 4%,transparent);--sh:transparent;--btn:transparent;--shadow:none;--r:4px;--bw:1px;--c1:#6b5ca5;--c2:#c4553a;--c3:#b08a55;--c4:#3f8f63;--c5:#E85A08;--c6:#3d7aa8;--good:#2f7d55;--bad:#C4383D;--scrim:rgba(20,14,10,.45);--device:#1b1b1b;--device-2:#3a3a3a;--k1:#F3ECDF;--k2:#F2A98F;--k3:#9FD4B4;--k4:#9CC3E6;--k5:#E7CFA6;--k6:#CDBDEB;--font:'Inter',system-ui,sans-serif;--disp:'Instrument Serif',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,monospace;--hand:'Instrument Serif',Georgia,serif;color-scheme:light}
/* hardcoded-colour audit: route remaining literals through tokens (QR stays black/white for scanning; gas/flame/thermo hues encode temperature) */
.modal{background:var(--scrim)!important}
.phone{background:var(--device)!important;border-color:var(--device-2)!important}.phone .notch{background:var(--device)!important}
#devPanel{box-shadow:0 18px 50px var(--scrim)!important}
.vcard .end,.slot.full .drop{color:var(--acc)!important}
.up{color:var(--good)!important}.down{color:var(--bad)!important}
.stu .meta span{background:color-mix(in srgb,var(--ink) 8%,transparent)!important;color:var(--ink)!important}
.tilt i{box-shadow:none!important}
.labpill:hover{background:var(--acc-h);filter:none}
.themebtn .pv{border-color:var(--line)!important}
/* palette picker */
.palrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.palbtn{display:flex;flex-direction:column;gap:8px;align-items:flex-start;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:8px;cursor:pointer;font:500 .82rem var(--font);min-width:0}
.palbtn .sw3{display:flex;width:100%;height:16px;border-radius:3px;overflow:hidden}.palbtn .sw3 i{flex:1}
.palbtn[aria-pressed=true]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.modeline{display:flex;justify-content:flex-end;margin-top:8px}

/* ===== D: mini-lab lessons ===== */

:root,[data-theme]{--font:'Geist','LumioInter','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--num:'Geist Mono','LumioInter','Inter',ui-monospace,monospace;--r-s:8px;--r-m:12px;--r-l:20px;--r:12px}
html body{font:400 15px/1.4 var(--font);font-synthesis:none;-webkit-font-smoothing:antialiased}
html :is(b,strong,h1,h2,h3,h4,h5,h6,th){font-weight:600}
html :is(button,.btn,label,select,input,.si,.sh){font-family:var(--font)}
html :is(.btn,button){font-weight:500}
html h2{font-size:22px;letter-spacing:-.01em}html h3{font-size:17px}
html :is(.mt-v,.mt-h b,.rv,.hm-rk b,.tile b,.sl output,.rvv,.cp-h b,.lrow .sc,.stu b){font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:500}
html .card{border-radius:var(--r-m)!important;border:1px solid var(--line)!important;box-shadow:none!important}
/* buttons: primary filled accent, secondary quiet filled */
html .btn{border:0!important;border-radius:var(--r-s)!important;background:color-mix(in srgb,var(--ink) 7%,transparent)!important;color:var(--ink)!important;box-shadow:none!important;padding:7px 12px;font-size:14px}
html .btn:hover{background:color-mix(in srgb,var(--ink) 11%,transparent)!important}
html :is(.btn.big,.btn.gam,.labpill){border:0!important}
html .btn.big{background:var(--acc)!important;color:var(--acc-ink)!important}
html .btn.gam{background:var(--gam)!important;color:var(--gam-ink)!important}
html .btn.gam.ghost{background:var(--gam-t)!important;color:var(--gam)!important}
html .labpill{border-radius:var(--r-l);font-weight:500}
html :is(button,.btn,a,input,select,[tabindex]):focus-visible{outline:2px solid var(--acc)!important;outline-offset:2px!important}
/* segmented: quiet track + raised indicator (iOS) */
html .segc{background:color-mix(in srgb,var(--ink) 6%,transparent)!important;border:0!important;border-radius:10px!important;padding:2px!important}
html .segc .segk{top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/var(--n));border-radius:8px!important;border:0!important;background:var(--card)!important;box-shadow:0 1px 3px rgba(0,0,0,.18)}
html .segc button{border-radius:8px!important;padding:6px 14px;font-weight:500;color:var(--muted)}
html .segc button[aria-selected=true]{color:var(--ink)}
html .seg{display:inline-flex;gap:2px;padding:2px;border-radius:10px;background:color-mix(in srgb,var(--ink) 6%,transparent)}
html .seg .btn{background:transparent!important;color:var(--muted)!important;padding:5px 12px!important;border-radius:8px!important}
html .seg .btn.on{background:var(--card)!important;color:var(--ink)!important;box-shadow:0 1px 3px rgba(0,0,0,.18)!important}
html .modesw{border:0!important;background:color-mix(in srgb,var(--ink) 6%,transparent)!important;border-radius:10px!important}
html .modesw button.on{background:var(--card)!important;color:var(--ink)!important;box-shadow:0 1px 3px rgba(0,0,0,.18)!important}
/* switch iOS */
html .sw{width:44px!important;height:26px!important;border:0!important;border-radius:13px!important;background:color-mix(in srgb,var(--ink) 16%,transparent)!important;flex:none}
html .sw::after{width:22px!important;height:22px!important;top:2px!important;left:2px!important;background:#fff!important;box-shadow:0 1px 3px rgba(0,0,0,.3)}
html .sw.on{background:var(--acc)!important}html .sw.on::after{left:20px!important;background:#fff!important}
/* sliders: 4px track, 20px thumb with ring */
html input[type=range]{height:20px!important;background:transparent!important;-webkit-appearance:none;appearance:none}
html input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--acc) var(--p,50%),color-mix(in srgb,var(--ink) 16%,transparent) var(--p,50%))}
html input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px!important;height:20px!important;margin-top:-8px;border-radius:50%;background:#fff!important;border:0!important;box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 18%,transparent),0 1px 4px rgba(0,0,0,.3)}
html input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:color-mix(in srgb,var(--ink) 16%,transparent)}
html input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--acc)}
html input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 18%,transparent),0 1px 4px rgba(0,0,0,.3)}
html select,html input:not([type=range]){border:1px solid var(--line)!important;border-radius:var(--r-s)!important;background:var(--card)!important;color:var(--ink)!important;box-shadow:none!important}
/* floating things get the only shadows */
#peek,#sbtip,#devPanel,.mbody{box-shadow:0 12px 32px var(--scrim)!important}
.mbody{border-radius:var(--r-l)!important;border:1px solid var(--line)!important}
/* ===== Settings: iOS grouped inset ===== */
#setBox.sg{display:block!important;max-width:680px;margin:0 auto;padding:0 0 32px}
.sgt{font:500 13px var(--font);color:var(--muted);margin:24px 16px 8px}.sgt:first-child{margin-top:8px}
.sgc{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.sgc>*{display:flex!important;align-items:center;justify-content:space-between;gap:16px;min-height:52px;padding:10px 16px!important;margin:0!important;border:0!important;border-bottom:1px solid var(--line)!important;flex-wrap:nowrap}
.sgc>*:last-child{border-bottom:0!important}
.sgc label,.sgc .sl-l{display:grid;gap:2px;min-width:0;flex:0 1 auto;font-weight:500}
.rt{font:500 15px var(--font);color:var(--ink);white-space:nowrap}.rc{font:400 12.5px var(--font);color:var(--muted)}
.sgc .ctl{display:flex;align-items:center;gap:12px;min-width:0;flex:0 1 auto;justify-content:flex-end}
.sgc input[type=range]{width:160px!important}
.sgc output.rvv{font:500 13px var(--num);color:var(--muted);min-width:36px;text-align:right}
.sgc select{max-width:220px}
.sgc .stack{display:grid!important;gap:12px;align-items:stretch}.sgc .stack>.rowh{display:flex;justify-content:space-between;align-items:center;gap:16px}
.sgc .palrow{margin-top:0}.sgc .modeline{margin-top:0}
.sgc .skset{display:grid!important}.sgc .skrow{gap:6px}
@media(max-width:520px){.sgc input[type=range]{width:110px!important}.sgc select{max-width:150px}}
/* v5.21 connect dialog + chip */
#modal.cdm{align-items:center}
.cdm .mbody{width:min(420px,calc(100vw - 32px))!important;padding:24px!important}
.cd{position:relative;display:grid;gap:12px;justify-items:center;text-align:center}
.cd h2{margin:0;font:400 28px var(--disp)}.cd-s{margin:0;color:var(--muted)}
.cd-x{position:absolute!important;right:-8px;top:-8px;width:32px;height:32px;padding:0!important;display:grid!important;place-items:center}
.cd-qr{width:236px;max-width:100%;aspect-ratio:1;background:#fff;border-radius:var(--r-m);padding:8px;display:grid;place-items:center;box-sizing:border-box;overflow:hidden}
.cd-qr svg,.cd-qr img,.cd-qr canvas{width:100%!important;height:auto!important;max-width:220px;display:block}
.cd-steps{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:8px;text-align:left;justify-self:stretch}
.cd-steps li{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;font-size:14px}.cd-steps li small{display:block;color:var(--muted);font-size:12.5px}
.cd-steps li>span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 8%,transparent);font:500 12px var(--num)}
.cd-steps li.ok>span{background:var(--good);color:var(--bg)}
.cd-st{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--muted)}.cd-st i{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:cdp 1.6s ease-in-out infinite}
.cd-st.ok{color:var(--ink)}.cd-st.ok i{background:var(--good);animation:none}
body.calm .cd-st i{animation:none}@keyframes cdp{50%{opacity:.3}}
.cd-warn{margin:0;color:var(--muted);font-size:13px}

const n2=x=>(Math.round(x*100)/100).toString().replace('-','−');
function poly(a,b,c){const ps=[],add=(co,v)=>{if(co===0)return;const ab=Math.abs(co);ps.push({neg:co<0,body:(ab===1&&v)?v:String(ab)+v})};add(a,'x²');add(b,'x');add(c,'');if(!ps.length)return'0';return ps.map((p,i)=>(i===0?(p.neg?'−':''):(p.neg?' − ':' + '))+p.body).join('')}

$('#formula').textContent='f(x) = '+poly(a,b,c);const D=b*b-4*a*c;let rt='—',vx='—',ax='—',dn=n2(D),ht;
if(a!==0){const xv=-b/(2*a),yv=-D/(4*a);vx=`V(${n2(xv)} , ${n2(yv)})`;ax='x = '+n2(xv);
if(D>0){const s=Math.sqrt(D),r1=(-b-s)/(2*a),r2=(-b+s)/(2*a);rt=`x₁=${n2(Math.min(r1,r2))}, x₂=${n2(Math.max(r1,r2))}`;ht=t('h_pos')}else if(D===0){rt='x₁=x₂='+n2(xv);ht=t('h_zero')}else{rt=t('no_roots');ht=t('h_neg')}}else{rt=t('line_only');ht=t('h_line')}

$('#quest').className='quest'+(L.quest?' done':'');$('#quest').textContent=(L.quest?'':'')+t(L.quest?'quest_done':'quest')}
function drawParab(now){const cv=$('#parab');if(!cv.clientWidth)return;const dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);const s=w/20,ox=w/2,oy=h/2,X=x=>ox+x*s,Y=y=>oy-y*s;
c.lineWidth=1;c.strokeStyle=COL.rule;c.globalAlpha=.7;c.beginPath();for(let x=-10;x<=10;x++){c.moveTo(X(x),0);c.lineTo(X(x),h)}for(let y=-8;y<=8;y++){c.moveTo(0,Y(y));c.lineTo(w,Y(y))}c.stroke();c.globalAlpha=1;
c.strokeStyle=COL.line;c.lineWidth=2.5;c.beginPath();c.moveTo(0,oy);c.lineTo(w,oy);c.moveTo(ox,0);c.lineTo(ox,h);c.stroke();
c.fillStyle=COL.muted;c.font='12px Fredoka,sans-serif';c.textAlign='center';for(let x=-9;x<=9;x+=3)if(x)c.fillText(x,X(x),oy+15);c.textAlign='right';for(let y=-6;y<=6;y+=3)if(y)c.fillText(y,ox-5,Y(y)+4);
const{a,b,c:cc}=L,f=x=>a*x*x+b*x+cc,D=b*b-4*a*cc;
if(a!==0){const xv=-b/(2*a),yv=f(xv);c.setLineDash([7,6]);c.strokeStyle=COL.c2;c.lineWidth=2.5;c.beginPath();c.moveTo(X(xv),0);c.lineTo(X(xv),h);c.stroke();c.setLineDash([])}
c.strokeStyle=COL.c1;c.lineWidth=5;c.lineCap='round';c.lineJoin='round';c.beginPath();let pen=false;for(let px=0;px<=w;px+=2){const y=f((px-ox)/s),py=Y(y);if(py<-200||py>h+200){pen=false;continue}if(!pen){c.moveTo(px,py);pen=true}else c.lineTo(px,py)}c.stroke();
const dot=(x,y,col,r,lab)=>{if(Math.abs(X(x)-w/2)>w/2||Math.abs(Y(y)-h/2)>h/2)return;c.fillStyle=col;c.strokeStyle=COL.line;c.lineWidth=3;c.beginPath();c.arc(X(x),Y(y),r,0,7);c.fill();c.stroke();if(lab){c.fillStyle=COL.ink;c.font='600 13px Fredoka,sans-serif';c.textAlign='left';c.fillText(lab,X(x)+r+4,Y(y)-r)}};
dot(0,cc,COL.c3,6,'c');if(a!==0){const xv=-b/(2*a),yv=f(xv),pulse=matchMedia('(prefers-reduced-motion: reduce)').matches?0:Math.sin(now/260)*2;dot(xv,yv,COL.c2,9+pulse,`V(${n2(xv)}, ${n2(yv)})`);
if(D>=0){const q=Math.sqrt(D);dot((-b-q)/(2*a),0,COL.c4,7);if(D>0)dot((-b+q)/(2*a),0,COL.c4,7)}}}

/* ---------- INK (handwriting) ---------- */
/* recognizer */
const REC={tpl:null,N:16,tmp:null,
build(){const fonts=['Arial','"Comic Sans MS"','Georgia','"Courier New"','"Patrick Hand"','"Segoe Print"','Verdana','"Trebuchet MS"'],T=[];
for(let d=0;d<=9;d++)for(const f of fonts)for(const wt of['400','700']){const cv=document.createElement('canvas');cv.width=100;cv.height=130;const c=cv.getContext('2d');c.font=`${wt} 96px ${f}`;c.textBaseline='alphabetic';c.fillStyle='#000';c.fillText(String(d),12,104);const g=this.grid(cv);if(g)T.push({ch:String(d),g})}
const cv=document.createElement('canvas');cv.width=40;cv.height=130;const c=cv.getContext('2d');c.lineWidth=9;c.lineCap='round';c.beginPath();c.moveTo(20,10);c.lineTo(20,120);c.stroke();const g=this.grid(cv);T.push({ch:'1',g});
const cv2=document.createElement('canvas');cv2.width=60;cv2.height=130;const c2=cv2.getContext('2d');c2.lineWidth=9;c2.lineCap='round';c2.beginPath();c2.moveTo(40,10);c2.lineTo(30,120);c2.stroke();T.push({ch:'1',g:this.grid(cv2)});this.tpl=T},
bbox(cv){const d=cv.getContext('2d').getImageData(0,0,cv.width,cv.height).data,W=cv.width,H=cv.height;let x0=W,y0=H,x1=-1,y1=-1;for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(d[(y*W+x)*4+3]>60){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}return x1<0?null:[x0,y0,x1-x0+1,y1-y0+1]},
grid(src,box){box=box||this.bbox(src);if(!box)return null;const N=this.N;this.tmp=this.tmp||document.createElement('canvas');this.tmp.width=this.tmp.height=N;const c=this.tmp.getContext('2d',{willReadFrequently:true});c.clearRect(0,0,N,N);c.imageSmoothingQuality='high';
const k=Math.min(12/box[2],12/box[3]),dw=box[2]*k,dh=box[3]*k;c.drawImage(src,box[0],box[1],box[2],box[3],(N-dw)/2,(N-dh)/2,dw,dh);const d=c.getImageData(0,0,N,N).data,a=new Float32Array(N*N);for(let i=0;i<N*N;i++)a[i]=d[i*4+3]/255;
const b=new Float32Array(N*N);for(let y=0;y<N;y++)for(let x=0;x<N;x++){let s=0,n=0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const xx=x+i,yy=y+j;if(xx>=0&&yy>=0&&xx<N&&yy<N){s+=a[yy*N+xx];n++}}b[y*N+x]=s/n}
let m=0;for(let i=0;i<b.length;i++)m+=b[i]*b[i];m=Math.sqrt(m)||1;for(let i=0;i<b.length;i++)b[i]/=m;return b},
run(cv){if(!this.tpl)this.build();const W=cv.width,H=cv.height,d=cv.getContext('2d').getImageData(0,0,W,H).data,col=new Int32Array(W);let ymin=H,ymax=0;
for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(d[(y*W+x)*4+3]>60){col[x]++;if(y<ymin)ymin=y;if(y>ymax)ymax=y}
const inkH=ymax-ymin+1;if(ymax<ymin)return{text:'',conf:0};const gap=Math.max(6,inkH*.14),gs=[];let x=0;
while(x<W){if(col[x]>0){let s=x,e=x;while(x<W){if(col[x]>0)e=x;else if(x-e>gap)break;x++}gs.push([s,e])}else x++}
const items=gs.map(([s,e])=>{let y0=H,y1=0;for(let y=0;y<H;y++)for(let xx=s;xx<=e;xx++)if(d[(y*W+xx)*4+3]>60){if(y<y0)y0=y;if(y>y1)y1=y;break}return{b:[s,y0,e-s+1,y1-y0+1]}});
const digH=Math.max(...items.filter(i=>i.b[2]<i.b[3]*2).map(i=>i.b[3]),0);let out='',cs=[];
for(const it of items){const[bx,by,bw,bh]=it.b;if(bw>bh*2.2&&bh<(digH||bw)*.6||(!digH&&bw>bh*1.8)){out+='-';cs.push(.9);continue}
if(digH&&bh<digH*.25&&bw<digH*.3){out+='.';cs.push(.8);continue}
const g=this.grid(cv,it.b);if(!g)continue;let best=-1,ch='?';for(const tp of this.tpl){let s=0;for(let i=0;i<g.length;i++)s+=g[i]*tp.g[i];if(s>best){best=s;ch=tp.ch}}out+=ch;cs.push(best)}
return{text:out,conf:cs.length?cs.reduce((a,b)=>a+b)/cs.length:0}}};

/* ---------- PRACTICE ---------- */
let padInk=null,recT=null;
const Q={cur:null,i:0,res:[],score:0,done:false};
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pk=a=>a[Math.floor(Math.random()*a.length)];
function genQ(){const k=pk(['delta','xv','f0','f1','root','delta']);let a,b,c,ans;
if(k==='delta'){a=pk([1,2,3,-1,-2]);b=ri(-6,6);c=ri(-5,5);ans=b*b-4*a*c}
else if(k==='xv'){a=pk([1,2,-1,-2]);const x=ri(-3,3);b=-2*a*x;c=ri(-4,4);ans=x}
else if(k==='f0'){a=pk([1,2,-1,-3]);b=ri(-6,6);c=ri(-7,7);ans=c}
else if(k==='f1'){a=pk([1,2,-1,-2]);b=ri(-5,5);c=ri(-6,6);ans=a+b+c}
else{const r1=ri(-4,2),r2=r1+ri(1,4);a=1;b=-(r1+r2);c=r1*r2;ans=r2}
return{k,a,b,c,ans}}
function newRound(){Q.i=0;Q.res=[];Q.score=0;Q.done=false;nextQ()}
function nextQ(){Q.cur=genQ();$('#fb').textContent='';$('#fb').className='fb';$('#ans').value='';{const ti=$('#typeIn');if(ti){ti.value='';if(S.io==='type'&&S.page==='practice')setTimeout(()=>ti.focus(),50)}}$('#conf').textContent='';padInk&&padInk.clear();renderQ();
const q=Q.cur;auto(t('q_'+(q.k==='f0'?'f0':q.k==='f1'?'f1':q.k))+'. '+t('sp_abc',{a:q.a,b:q.b,c:q.c}))}
function renderQ(){const q=Q.cur;if(!q)return;$('#qText').innerHTML=`f(x) = ${poly(q.a,q.b,q.c)}<small>${t('q_'+q.k)}</small>`;
$('#qDots').innerHTML=[0,1,2,3,4].map(i=>`<i class="${Q.res[i]===true?'ok':Q.res[i]===false?'no':i===Q.i?'cur':''}"></i>`).join('')}
function runRec(){const r=REC.run(padInk.cv);$('#ans').value=r.text;$('#conf').textContent=r.text?`${Math.round(r.conf*100)}%`:''}
function checkAns(){if(Q.done){newRound();return}const raw=$('#ans').value.replace('−','-').replace(',','.').trim();if(raw===''||isNaN(+raw)){$('#fb').className='fb bad';$('#fb').textContent=t('write_first');AU.bad();return}
const q=Q.cur,ok=+raw===q.ans,fb=$('#fb');
if(ok){AU.ok();Q.score++;Q.res[Q.i]=true;fb.className='fb good';fb.innerHTML=''+pk([t('ok1'),t('ok2'),t('ok3')]);addXP(10+Math.min(S.streak,5)*2);bumpStreak();CF.burst(60);$('#qText').classList.add('jump');setTimeout(()=>$('#qText').classList.remove('jump'),600);auto(t('ok1'))}
else{AU.bad();Q.res[Q.i]=false;fb.className='fb bad';fb.innerHTML=''+t('no1',{ans:String(q.ans).replace('-','−')});loseStreak();$('#pad').classList.add('shake');setTimeout(()=>$('#pad').classList.remove('shake'),500);auto(t('no1',{ans:q.ans}))}
Q.i++;renderQ();$('#checkBtn').disabled=true;
setTimeout(()=>{$('#checkBtn').disabled=false;if(Q.i>=5){Q.done=true;fb.className='fb good';fb.innerHTML=''+t('round_done',{s:Q.score});$('#checkBtn').textContent=t('new_round');if(Q.score>=4){AU.streak();CF.burst(180)}}else nextQ()},ok?1100:1900)}
function hintQ(){const q=Q.cur;if(!q)return;const m={delta:'hint_delta',xv:'hint_xv',f0:'hint_f0',f1:'hint_f1',root:'hint_root'}[q.k];const s=t(m,{a:q.a,b:q.b,c:q.c});$('#fb').className='fb';$('#fb').textContent=''+s;auto(s)}
function initPractice(){padInk=new Ink($('#pad'),{w:6,onChange:e=>{$('.hint',$('#pad')).style.display=padInk.strokes.length?'none':'';clearTimeout(recT);if(e==='clear'){$('#ans').value='';return}recT=setTimeout(runRec,650)}});
$('#toolPen').onclick=()=>{padInk.setTool('pen');$('#toolPen').classList.add('on');$('#toolEr').classList.remove('on')};$('#toolEr').onclick=()=>{padInk.setTool('eraser');$('#toolEr').classList.add('on');$('#toolPen').classList.remove('on')};
$('#toolUndo').onclick=()=>padInk.undo();$('#toolClr').onclick=()=>padInk.clear();$('#checkBtn').onclick=checkAns;$('#hintBtn').onclick=hintQ;
$('#ans').addEventListener('keydown',e=>{if(e.key==='Enter')checkAns()});
$('#qRead').onclick=()=>{const q=Q.cur;if(q)TTS.say(t('q_'+q.k)+'. '+t('sp_abc',{a:q.a,b:q.b,c:q.c}),S.lang)}}

const Net={on:false,es:null,info:null,peers:0,q:{},qt:null,
async init(){if(!/^https?:/.test(location.protocol))return netUI();try{const r=await fetch('/api/info',{cache:'no-store'}),j=await r.json();if(j.app!=='incognia')throw 0;this.info=j;this.connect()}catch(e){netUI()}},
connect(){this.es=new EventSource('/events');this.es.onopen=()=>{this.on=true;netUI();this.send({type:'hello'})};this.es.onerror=()=>{this.on=false;netUI()};
 this.es.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch(_){return}(Array.isArray(d)?d:[d]).forEach(onRemote)}},
send(m){if(!this.on)return;m.from=m.from||TAB;if(m.type==='param'){this.q[m.lab+'.'+m.k]=m;if(!this.qt)this.qt=setTimeout(()=>this.flush(),33);return}this.flush();this.post([m])},
