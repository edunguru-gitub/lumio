<style>
/* Lumio galaxy home: planets are the interface. Hover or tap opens a small card. Questions are a permanent widget. */

html,body{margin:0;height:100%}

.nd .nm{font:400 1.05rem var(--serif)}.nd .st{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.nd .tk{font-size:12px;color:var(--ink)}.nd ul{margin:0;padding:0;list-style:none;display:grid;gap:3px;color:var(--muted)}

#qw .who{color:var(--tan);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-top:4px}
.q{transition:opacity .2s}.q.gone{opacity:0}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qb{display:none}

 #qw.min>*:not(.qb){display:none}#qw.min .qb{display:flex}
 .qb{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
 .pop{left:0!important;right:0!important;top:auto!important;bottom:0!important;width:auto;max-width:none;max-height:50vh;overflow:auto;border-radius:12px 12px 0 0}
}
@media (prefers-reduced-motion:reduce){.pop,.q,button.t::after{transition:none}}

@media(max-width:600px){.tr{grid-template-columns:1fr auto}.tt{grid-column:1/-1;order:3}}
#nowt{position:absolute;top:46px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.14em;text-transform:uppercase;z-index:4}
#now{position:absolute;top:70px;left:50%;transform:translateX(-50%);width:min(560px,50vw);display:grid;grid-template-columns:repeat(2,1fr);gap:8px;z-index:4;pointer-events:none}
#now .tp{border:1px solid var(--line);border-radius:8px;background:rgba(33,30,26,.88);padding:6px 8px;display:grid;gap:2px;align-content:start;max-height:112px;overflow:hidden}

#now .k{color:var(--muted);white-space:nowrap}#now .cc .k{color:var(--c)}#now .v{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

</style>
